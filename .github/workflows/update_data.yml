name: Auto Fetch Data and Deploy

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push to the repo
      pages: write # Important: allows the action to trigger a pages rebuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Analytical Pipeline
        run: node run_pipeline.js

      - name: Commit updated Dashboard Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard_data.js historical_ou_stats.json historical_fifa.json || true
          # Only commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "Auto-update dashboard data [skip ci]"
          # Rebase onto the latest remote main before pushing so a concurrent/manual
          # push in between our checkout and push doesn't reject us outright.
          git pull --rebase origin main
          git push

      - name: Trigger GitHub Pages Rebuild
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
